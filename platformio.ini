; ── Shared base — inherited by all [env:xxx] sections ─────────
[env]
platform      = espressif32
framework     = arduino
extra_scripts = patch.py

lib_deps =
    m5stack/M5Unified

monitor_speed = 115200
upload_speed  = 921600

; ── M5Stack CoreS3 (320×240) ───────────────────────────────────
[env:m5stack-cores3]
board = m5stack-cores3
build_flags =
    -DARDUINO_M5STACK_CORES3
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -Wno-odr
    -Wno-lto-type-mismatch

; ── M5Stack Cardputer (240×135) ────────────────────────────────
[env:m5stack-cardputer]
board = m5stack-stamps3
build_flags =
    -DARDUINO_M5STACK_CARDPUTER
    -Wno-odr
    -Wno-lto-type-mismatch
