; ── Shared base — inherited by all [env:xxx] sections ─────────
[env]
platform      = espressif32@6.13.0
framework     = arduino
extra_scripts =
    tools/embed_web.py
    tools/patch.py
    post:tools/build.py

lib_deps =
    bodmer/TFT_eSPI
    ESP32Async/ESPAsyncWebServer
    ESP32Async/AsyncTCP

lib_ignore =
    M5Unified
    M5GFX

monitor_speed = 115200
upload_speed  = 921600

; ── M5Stack CoreS3 (320×240, ILI9342C, shared HSPI for SD+TFT) ─
[env:m5stack-cores3]
board = m5stack-cores3
build_src_filter = +<*>
build_flags =
    -DARDUINO_M5STACK_CORES3
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    ; ── TFT_eSPI user setup (overrides bundled User_Setup.h) ───
    -DDISABLE_ALL_LIBRARY_WARNINGS=1
    -DUSER_SETUP_LOADED=1
    -DILI9342_DRIVER
    -DTFT_INVERSION_ON
    -DTFT_MOSI=37
    -DTFT_SCLK=36
    -DTFT_CS=3
    -DTFT_DC=35
    -DTFT_RST=-1
    -DTFT_MISO=-1
    -DTFT_BL=-1
    -DTFT_BACKLIGHT_ON=HIGH
    -DTOUCH_CS=-1
    -DUSE_HSPI_PORT
    -DLOAD_GLCD
    -DLOAD_FONT2
    -DLOAD_FONT4
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000
